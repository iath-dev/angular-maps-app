<main class="w-screen h-[calc(100vh-64px)] p-4">
  <div
    class="fixed z-50 bottom-5 right-5 shadow-xl border bg-base-200/90 p-4 rounded-xl flex gap-4 items-center justify-center"
  >
    <h2 class="flex gap-2 items-center justify-center">
      Zoom: <small>{{ zoom() | number : "1.0-0" }}</small>
    </h2>
    <input
      type="range"
      min="0"
      max="20"
      [value]="zoom()"
      (input)="zoom.set(+txtZoom.value)"
      #txtZoom
      class="range range-xs md:w-md w-3xs"
    />
  </div>
  <section #map class="w-full h-full rounded-2xl"></section>
</main>
